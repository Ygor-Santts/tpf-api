# Every push to main is built here and, if it builds, published on the server.
# Needs the repository secrets SERVER_HOST, SERVER_USER and SERVER_SSH_KEY
# (see "Publicação automática" in the README).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Update the server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "::notice::Server secrets not set yet, skipping the deploy."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" '
            set -e
            export GIT_TERMINAL_PROMPT=0
            cd ~/tpf-api
            OLD_CADDYFILE=$(git rev-parse HEAD:Caddyfile)
            OLD_API=$(git rev-parse HEAD)
            OLD_APP=$(git -C ../tpf-app rev-parse HEAD)
            git pull --ff-only
            git -C ../tpf-app pull --ff-only
            # Only rebuild the API and the app when their code changed. A push that
            # only touches the Caddyfile, docs or workflows must not restart the API.
            CODE_CHANGED=$(git diff --name-only "$OLD_API" HEAD | grep -vE "^(Caddyfile|README\.md|\.github/|deploy/)" || true)
            if [ -n "$CODE_CHANGED" ] || [ "$OLD_APP" != "$(git -C ../tpf-app rev-parse HEAD)" ]; then
              docker compose --env-file .env.server -f docker-compose.server.yml up -d --build
            else
              echo "Only config or docs changed: API and app containers left running as they are."
            fi
            # Caddy only reads its config at start, and compose does not
            # restart it when just the Caddyfile changed.
            if [ "$OLD_CADDYFILE" != "$(git rev-parse HEAD:Caddyfile)" ]; then
              docker compose --env-file .env.server -f docker-compose.server.yml restart caddy
            fi
            docker image prune -f
          '
